<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U.S. Government Quiz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            background-color: #fff;
            text-align: center;
        }
        h1 {
            color: #007BFF;
            font-size: 32px;
            font-weight: bold;
        }
        .question-indicator {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .question {
            font-size: 24px;
            margin-bottom: 20px;
        }
        .option {
            display: block;
            margin: 10px 0;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            font-size: 20px;
            transition: background-color 0.3s;
        }
        .option:hover {
            background-color: #f0f0f0;
        }
        button {
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
            margin-top: 20px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .feedback {
            margin: 10px 0;
            font-weight: bold;
            font-size: 20px;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <h1>Citizenship</h1>
    <div id="quiz-container">
        <div class="question-indicator" id="question-indicator"></div>
        <div class="question" id="question-text"></div>
        <div id="answer-options"></div>
        <button id="submit-answer">Submit Answer</button>
        <div class="feedback hidden" id="feedback"></div>
        <button id="next-question" class="hidden">Next Question</button>
    </div>

    <div id="results" class="hidden"></div>

    <script>
     const questions = [
    {
        question: "The House of Representatives has how many voting members?",
        options: ["One hundred (100)", "Two hundred (200)", "Three hundred fifty (350)", "Four hundred thirty-five (435)"],
        answer: 3
    },
    {
        question: "We elect a U.S. Representative for how many years?",
        options: ["Two (2)", "Four (4)", "Six (6)", "Eight (8)"],
        answer: 0
    },
    {
        question: "Name your U.S. Representative.",
        options: ["AL Green", "Nancy Pelosi", "Kevin McCarthy", "Mitch McConnell"],
        answer: 0
    },
    {
        question: "Who does a U.S. Senator represent?",
        options: ["Only their party members", "Only those who voted for them", "All people of the state", "Only the wealthy"],
        answer: 2
    },
    {
        question: "Why do some states have more Representatives than other states?",
        options: ["Because of the state's population", "Because they have more land area", "Because they have more electoral votes", "Because they joined the Union earlier"],
        answer: 0
    },
    {
        question: "We elect a President for how many years?",
        options: ["Two (2)", "Four (4)", "Six (6)", "Eight (8)"],
        answer: 1
    },
    {
        question: "In what month do we vote for President?",
        options: ["September", "October", "November", "December"],
        answer: 2
    },
    {
        question: "What is the name of the President of the United States now?",
        options: ["Donald Trump", "Barack Obama", "Joe Biden", "George W. Bush"],
        answer: 2
    },
    {
        question: "What is the name of the Vice President of the United States now?",
        options: ["Mike Pence", "Kamala Harris", "Joe Biden", "Dick Cheney"],
        answer: 1
    },
    {
        question: "If the President can no longer serve, who becomes President?",
        options: ["The Vice President", "The Speaker of the House", "The Secretary of State", "The Chief Justice"],
        answer: 0
    },
    {
        question: "If both the President and the Vice President can no longer serve, who becomes President?",
        options: ["The Secretary of State", "The Chief Justice", "The Speaker of the House", "The Senate Majority Leader"],
        answer: 2
    },
    {
        question: "Who is the Commander in Chief of the military?",
        options: ["The Secretary of Defense", "The President", "The Chairman of the Joint Chiefs of Staff", "The Vice President"],
        answer: 1
    },
    {
        question: "Who signs bills to become laws?",
        options: ["The President", "The Vice President", "The Speaker of the House", "The Chief Justice"],
        answer: 0
    },
    {
        question: "Who vetoes bills?",
        options: ["The Chief Justice", "The Senate Majority Leader", "The Speaker of the House", "The President"],
        answer: 3
    },
    {
        question: "What does the President's Cabinet do?",
        options: ["Makes laws", "Advises the President", "Decides court cases", "Approves the budget"],
        answer: 1
    },
    {
        question: "What are two Cabinet-level positions?",
        options: ["Secretary of State and Secretary of Defense", "Chief of Staff and Press Secretary", "Senate Majority Leader and House Speaker", "Chief Justice and Attorney General"],
        answer: 0
    },
    {
        question: "What does the judicial branch do?",
        options: ["Makes laws", "Enforces laws", "Reviews laws", "Approves the budget"],
        answer: 2
    },
    {
        question: "What is the highest court in the United States?",
        options: ["The Federal Court", "The Supreme Court", "The District Court", "The Court of Appeals"],
        answer: 1
    },
    {
        question: "How many justices are on the Supreme Court?",
        options: ["Seven (7)", "Nine (9)", "Eleven (11)", "Thirteen (13)"],
        answer: 1
    },
    {
        question: "Who is the Chief Justice of the United States now?",
        options: ["John G. Roberts Jr.", "Clarence Thomas", "Samuel Alito", "Sonia Sotomayor"],
        answer: 0
    }
];

        let currentQuestionIndex = 0;
        let score = 0;

        function loadQuestion() {
            const question = questions[currentQuestionIndex];
            document.getElementById('question-indicator').innerText = `Question ${currentQuestionIndex + 1} of ${questions.length}`;
            document.getElementById('question-text').innerText = question.question;
            const optionsContainer = document.getElementById('answer-options');
            optionsContainer.innerHTML = '';

            question.options.forEach((option, index) => {
                optionsContainer.innerHTML += `
                    <div class="option" onclick="selectOption(${index})">${option}</div>
                `;
            });

            document.getElementById('feedback').classList.add('hidden');
            document.getElementById('submit-answer').classList.remove('hidden');
            document.getElementById('next-question').classList.add('hidden');
        }

        function selectOption(index) {
            const options = document.querySelectorAll('.option');
            options.forEach((option, i) => {
                option.style.backgroundColor = i === index ? '#cce5ff' : '#fff';
            });
            document.getElementById('submit-answer').dataset.selected = index;
        }

        document.getElementById('submit-answer').addEventListener('click', function() {
            const selectedAnswer = document.getElementById('submit-answer').dataset.selected;
            if (selectedAnswer !== undefined) {
                const selectedValue = parseInt(selectedAnswer);
                const correctAnswer = questions[currentQuestionIndex].answer;

                if (selectedValue === correctAnswer) {
                    score++;
                    document.getElementById('feedback').innerText = "Correct!";
                } else {
                    document.getElementById('feedback').innerText = "Wrong! The correct answer was: " + questions[currentQuestionIndex].options[correctAnswer];
                }

                document.getElementById('feedback').classList.remove('hidden');
                document.getElementById('submit-answer').classList.add('hidden');
                document.getElementById('next-question').classList.remove('hidden');
            } else {
                alert("Please select an answer before submitting.");
            }
        });

        document.getElementById('next-question').addEventListener('click', function() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                document.getElementById('quiz-container').classList.add('hidden');
                document.getElementById('results').innerHTML = `You scored ${score} out of ${questions.length}.`;
                document.getElementById('results').classList.remove('hidden');
            }
        });

        loadQuestion();
    </script>
</body>
</html>
