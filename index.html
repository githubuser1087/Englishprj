<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U.S. Government Quiz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            background-color: #fff;
            text-align: center;
        }
        h1 {
            color: #007BFF;
            font-size: 32px;
            font-weight: bold;
        }
        .question-indicator {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .question {
            font-size: 24px;
            margin-bottom: 20px;
        }
        .option {
            display: block;
            margin: 10px 0;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            font-size: 20px;
            transition: background-color 0.3s;
        }
        .option:hover {
            background-color: #f0f0f0;
        }
        button {
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
            margin-top: 20px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .feedback {
            margin: 10px 0;
            font-weight: bold;
            font-size: 20px;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <h1>Citizenship</h1>
    <div id="quiz-container">
        <div class="question-indicator" id="question-indicator"></div>
        <div class="question" id="question-text"></div>
        <div id="answer-options"></div>
        <button id="submit-answer">Submit Answer</button>
        <div class="feedback hidden" id="feedback"></div>
        <button id="next-question" class="hidden">Next Question</button>
    </div>

    <div id="results" class="hidden"></div>

    <script>
        const questions = [
            {
                question: "What is the supreme law of the land?",
                options: ["The Declaration of Independence", "The Constitution", "The Bill of Rights", "The Federalist Papers"],
                answer: 1
            },
            {
                question: "What does the Constitution do?",
                options: ["Sets up the government", "Defines the government", "Protects basic rights of Americans", "All of the above"],
                answer: 3
            },
            {
                question: "The idea of self-government is in the first three words of the Constitution. What are these words?",
                options: ["Life, Liberty, Pursuit", "We the People", "United States Constitution", "Government for People"],
                answer: 1
            },
            {
                question: "What is an amendment?",
                options: ["A law passed by Congress", "A Supreme Court decision", "A change or addition to the Constitution", "A presidential order"],
                answer: 2
            },
            {
                question: "What do we call the first ten amendments to the Constitution?",
                options: ["The Federalist Papers", "The Articles of Confederation", "The Bill of Rights", "The Declaration of Rights"],
                answer: 2
            },
            {
                question: "What is one right or freedom from the First Amendment?",
                options: ["Right to bear arms", "Freedom of speech", "Right to a speedy trial", "Freedom from unreasonable searches"],
                answer: 1
            },
            {
                question: "How many amendments does the Constitution have?",
                options: ["Ten (10)", "Thirteen (13)", "Twenty-seven (27)", "Fifty (50)"],
                answer: 2
            },
            {
                question: "What did the Declaration of Independence do?",
                options: ["Established the first government", "Ended the Revolutionary War", "Created the Constitution", "Announced our independence from Great Britain"],
                answer: 3
            },
            {
                question: "What are two rights in the Declaration of Independence?",
                options: ["Life and liberty", "Liberty and pursuit of happiness", "Life and pursuit of happiness", "All of the above"],
                answer: 3
            },
            {
                question: "What is freedom of religion?",
                options: ["You must practice a religion", "You can practice any religion, or not practice a religion", "You must practice the state religion", "You can only practice certain approved religions"],
                answer: 1
            },
            {
                question: "What is the economic system in the United States?",
                options: ["Socialist economy", "Communist economy", "Capitalist economy", "Mixed economy"],
                answer: 2
            },
            {
                question: "What is the 'rule of law'?",
                options: ["Laws are made by the President", "Everyone must follow the law", "Only citizens must follow the law", "Laws can be ignored by government officials"],
                answer: 1
            },
            {
                question: "Name one branch or part of the government.",
                options: ["Legislative", "Military", "State", "Local"],
                answer: 0
            },
            {
                question: "What stops one branch of government from becoming too powerful?",
                options: ["The President", "The Supreme Court", "Checks and balances", "The Constitution"],
                answer: 2
            },
            {
                question: "Who is in charge of the executive branch?",
                options: ["The President", "The Speaker of the House", "The Chief Justice", "The Senate Majority Leader"],
                answer: 0
            },
            {
                question: "Who makes federal laws?",
                options: ["The President", "The Supreme Court", "State legislatures", "Congress"],
                answer: 3
            },
            {
                question: "What are the two parts of the U.S. Congress?",
                options: ["The House and the Senate", "The President and Vice President", "The Supreme Court and lower courts", "The Executive and Judicial branches"],
                answer: 0
            },
            {
                question: "How many U.S. Senators are there?",
                options: ["Fifty (50)", "One hundred (100)", "Four hundred thirty-five (435)", "Two hundred (200)"],
                answer: 1
            },
            {
                question: "We elect a U.S. Senator for how many years?",
                options: ["Two (2)", "Four (4)", "Six (6)", "Eight (8)"],
                answer: 2
            },
            {
                question: "Who is one of your state's U.S. Senators now?",
                options: ["Answers will vary", "The governor", "The state representative", "The mayor"],
                answer: 0
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;

        function loadQuestion() {
            const question = questions[currentQuestionIndex];
            document.getElementById('question-indicator').innerText = `Question ${currentQuestionIndex + 1} of ${questions.length}`;
            document.getElementById('question-text').innerText = question.question;
            const optionsContainer = document.getElementById('answer-options');
            optionsContainer.innerHTML = '';

            question.options.forEach((option, index) => {
                optionsContainer.innerHTML += `
                    <div class="option" onclick="selectOption(${index})">${option}</div>
                `;
            });

            document.getElementById('feedback').classList.add('hidden');
            document.getElementById('submit-answer').classList.remove('hidden');
            document.getElementById('next-question').classList.add('hidden');
        }

        function selectOption(index) {
            const options = document.querySelectorAll('.option');
            options.forEach((option, i) => {
                option.style.backgroundColor = i === index ? '#cce5ff' : '#fff';
            });
            document.getElementById('submit-answer').dataset.selected = index;
        }

        document.getElementById('submit-answer').addEventListener('click', function() {
            const selectedAnswer = document.getElementById('submit-answer').dataset.selected;
            if (selectedAnswer !== undefined) {
                const selectedValue = parseInt(selectedAnswer);
                const correctAnswer = questions[currentQuestionIndex].answer;

                if (selectedValue === correctAnswer) {
                    score++;
                    document.getElementById('feedback').innerText = "Correct!";
                } else {
                    document.getElementById('feedback').innerText = "Wrong! The correct answer was: " + questions[currentQuestionIndex].options[correctAnswer];
                }

                document.getElementById('feedback').classList.remove('hidden');
                document.getElementById('submit-answer').classList.add('hidden');
                document.getElementById('next-question').classList.remove('hidden');
            } else {
                alert("Please select an answer before submitting.");
            }
        });

        document.getElementById('next-question').addEventListener('click', function() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                document.getElementById('quiz-container').classList.add('hidden');
                document.getElementById('results').innerHTML = `You scored ${score} out of ${questions.length}.`;
                document.getElementById('results').classList.remove('hidden');
            }
        });

        loadQuestion();
    </script>
</body>
</html>
